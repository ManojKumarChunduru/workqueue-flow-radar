# Generator and analysis knobs. Override the file with WQ_RADAR_CONFIG
# or individual values with WQ_RADAR__SECTION__KEY env vars.

generator:
  seed: 42
  n_claims: 20000
  start_date: "2025-05-01"
  horizon_days: 30
  # Routing rule set
  n_workqueues: 8
  n_rules: 24
  n_conflicting_pairs: 3     # planted rule pairs with overlapping
                             # predicates routing to different queues
  # Lifecycle behavior
  mean_touches_per_visit: 1.6
  defer_rate: 0.12
  rework_rate: 0.05          # legitimate A -> B -> A returns (not conflicts)
  max_bounce_cycles: 6       # oscillations before staff force-resolve

analysis:
  # A claim is flagged ping-pong when it oscillates between the same
  # two queues at least this many transitions (A->B->A = 2).
  min_oscillations: 3

paths:
  data_dir: "data"
  events_file: "data/wq_events.parquet"
  claims_file: "data/claims.parquet"
  rules_file: "data/routing_rules.parquet"
  labels_file: "data/ground_truth.parquet"
  duckdb_file: "data/radar.duckdb"
  output_dir: "output"
